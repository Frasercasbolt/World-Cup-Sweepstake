name: Update World Cup results

on:
  schedule:
    # Every 30 minutes through the daily match window so the board updates
    # at the final whistle of each game. Kick-offs run 16:00-04:00 UTC and
    # extra time + penalties can stretch a match past 2.5 hours.
    # Four ticks an hour at off-peak minutes. GitHub's shared cron scheduler
    # drops sub-hourly ticks freely under load (observed: 6h of silence),
    # so we over-provision — even if half are dropped, updates stay ~30-min.
    # Each run costs one cheap API call, so the redundancy is free.
    - cron: "7,22,37,52 16-23 * * *"
    - cron: "7,22,37,52 0-7 * * *"
  workflow_dispatch: {}   # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update results.json from football-data.org
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python3 update_results.py

      - name: Commit if changed
        run: |
          git config user.name "sweepstake-bot"
          git config user.email "actions@github.com"
          git add results.json
          git diff --cached --quiet || git commit -m "Update scores $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase origin main   # survive a race with any overlapping run
          git push
