name: Update World Cup results

on:
  schedule:
    - cron: "30 4 * * *"
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update results.json from football-data.org
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python3 /update_results.py

      - name: Commit if changed
        run: |
          git config user.name "sweepstake-bot"
          git config user.email "actions@github.com"
          git add results.json
          git diff --cached --quiet || git commit -m "Update scores $(date -u +'%Y-%m-%d %H:%M')"
          git push
